name: MacBook Price Tracker

on:
  schedule:
    # Laeuft alle 30 Minuten
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

# Verhindert ueberlappende Laeufe: GitHub Actions kann geplante Trigger unter
# Last verzoegert starten, und der Tracker-Lauf selbst kann sich dem
# 30-Minuten-Fenster annaehern (DEFAULT_BUDGET_SECONDS=1500s). Ohne diesen
# Block koennten zwei parallele Laeufe dieselben Produkte doppelt scrapen
# und doppelte Discord-Nachrichten senden. cancel-in-progress: false laesst
# einen bereits laufenden Job zu Ende laufen, statt ihn abzubrechen -- ein
# neuer Trigger wartet stattdessen in der Warteschlange.
concurrency:
  group: price-tracker
  cancel-in-progress: false

jobs:
  track-price:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies installieren
        run: pip install -r requirements.txt

      - name: Preis-Tracker ausfuehren
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python price_tracker.py
